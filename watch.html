<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Video</title>

<style>
body {
    margin: 0;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
}

header {
    background: #171717;
    color: white;
    padding: 18px;
    font-size: 23px;
    font-weight: bold;
}

.player {
    width: 100%;
    background: black;
    margin-top: 15px;
}

video {
    width: 100%;
    display: block;
    aspect-ratio: 16/9;
}

    padding: 12px;
}
</style>
</head>

<body>

<header>My Video Website</header>

<h2 id="title">Video Title 2</h2>

<div class="player">
<video controls playsinline preload="metadata">
    <source
    src="-2428178015761973789.mp4"
    type="video/mp4">
</video>
</div>

</body>
</html>
