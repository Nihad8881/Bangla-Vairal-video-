<script>

{title:"Video Title 20", views:"72.4K", category:"category2", duration:"08:25"}

];

let selectedCategory = "all";

const grid = document.getElementById("videoGrid");

function displayVideos() {

    let search = document
    .getElementById("search")
    .value.toLowerCase();

    let filtered = videos.filter(video => {

        let categoryMatch =
        selectedCategory === "all" ||
        video.category === selectedCategory;

        let searchMatch =
        video.title.toLowerCase().includes(search);

        return categoryMatch && searchMatch;

    });

    grid.innerHTML = "";

    if(filtered.length === 0) {
        grid.innerHTML =
        '<div class="no-video">No videos found!</div>';
        return;
    }

    filtered.forEach((video) => {

        let originalNumber = videos.indexOf(video) + 1;

        let card = document.createElement("div");

        card.className = "video-card";

        card.innerHTML = `

        <div class="thumbnail">

            <img
            src="images/IMG_6694.jpeg"
            alt="${video.title}"
            loading="lazy">

            <span class="duration">
            ${video.duration}
            </span>

        </div>

        <div class="video-title">
        ${video.title}
        </div>

        <div class="video-info">
        👤 Admin | ${video.views} views
        </div>

        `;

        card.addEventListener("click", () => {
            openVideo(originalNumber);
        });

        grid.appendChild(card);

    });

}

function filterVideos(category,button) {

    selectedCategory = category;

    document.querySelectorAll(".categories button")
    .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    displayVideos();

}

document.getElementById("search")
.addEventListener("input", displayVideos);

function openVideo(number) {

    window.location.href = "watch.html?id=" + number;

}

displayVideos();

</script>
