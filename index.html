<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Video Website</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f5f5;
    font-family: Arial, sans-serif;
    color: #222;
}

header {
    background: #171717;
    color: white;
    padding: 20px;
    font-size: 25px;
    font-weight: bold;
}

.logo {
    color: #ff4055;
}

.age-notice {
    background: #292929;
    color: white;
    padding: 12px;
    text-align: center;
    font-size: 13px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 15px;
}

.heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.heading h2 {
    font-size: 22px;
}

.count {
    color: #777;
    font-size: 13px;
}

.tabs {
    display: flex;
    border-bottom: 2px solid #ddd;
    margin-bottom: 20px;
}

.tabs button {
    background: none;
    border: none;
    color: #ff4055;
    border-bottom: 4px solid #ff4055;
    padding: 12px 18px;
    font-size: 18px;
    font-weight: bold;
}

.search {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    margin-bottom: 15px;
}

.categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 15px;
}

.categories button {
    border: none;
    background: #e2e2e2;
    padding: 11px 16px;
    border-radius: 6px;
    white-space: nowrap;
    cursor: pointer;
    font-size: 14px;
}

.categories button.active {
    background: #ff4055;
    color: white;
}

.video-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

.video-card {
    min-width: 0;
    cursor: pointer;
}

.thumbnail {
    width: 100%;
    aspect-ratio: 16/9;
    position: relative;
    background: #ddd;
    border-radius: 7px;
    overflow: hidden;
}

.thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.play-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,.7);
    color: white;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 23px;
}

.duration {
    position: absolute;
    bottom: 8px;
    right: 7px;
    background: rgba(0,0,0,.8);
    color: white;
    padding: 4px 7px;
    font-size: 12px;
    border-radius: 4px;
}

.video-title {
    font-size: 15px;
    font-weight: bold;
    margin: 9px 0 6px;
    line-height: 1.4;
}

.video-info {
    color: #777;
    font-size: 12px;
    margin-bottom: 15px;
}

.no-video {
    text-align: center;
    padding: 30px;
    color: #777;
    grid-column: 1/-1;
}

/* Video Player */

.player-modal {
    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;
    background: rgba(0,0,0,.95);
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.player-content {
    width: 100%;
    max-width: 850px;
    position: relative;
}

.player-content video {
    width: 100%;
    display: block;
    background: black;
    border-radius: 8px;
}

.close-player {
    position: absolute;
    right: 0;
    top: -48px;
    background: #ff4055;
    color: white;
    border: none;
    padding: 9px 16px;
    font-size: 18px;
    border-radius: 5px;
    cursor: pointer;
}

footer {
    background: #171717;
    color: white;
    text-align: center;
    padding: 25px;
    margin-top: 30px;
}

@media(min-width:700px) {
    .video-grid {
        grid-template-columns: repeat(3,1fr);
    }
}

@media(min-width:1000px) {
    .video-grid {
        grid-template-columns: repeat(4,1fr);
    }
}
</style>
</head>

<body>

<header>
    <span class="logo">My</span> Video Website
</header>

<div class="age-notice">
    Adults Only — 18+ Age Restricted Content
</div>

<div class="container">

    <div class="heading">
        <h2>Video Collection</h2>
        <span class="count">20 Videos</span>
    </div>

    <div class="tabs">
        <button>▶ All Videos</button>
    </div>

    <input
        type="search"
        id="search"
        class="search"
        placeholder="🔍 Search videos..."
    >

    <div class="categories">

        <button class="active"
        onclick="filterVideos('all',this)">
        All Videos
        </button>

        <button
        onclick="filterVideos('category1',this)">
        Category 1
        </button>

        <button
        onclick="filterVideos('category2',this)">
        Category 2
        </button>

    </div>

    <div class="video-grid" id="videoGrid"></div>

</div>

<!-- Video Player -->

<div class="player-modal" id="playerModal">

    <div class="player-content">

        <button class="close-player"
        onclick="closeVideo()">✕ Close</button>

        <video id="mainPlayer"
        controls
        playsinline
        preload="metadata">
        </video>

    </div>

</div>

<footer>
    MY VIDEO WEBSITE © 2026
</footer>

<script>

// VIDEO DATABASE

const videos = [

{
title:"Video Title 1",
views:"12.5K",
category:"category1",
duration:"06:24",
poster:"https://cdn.hyperserve.io/27503482-3ae8-4524-8fe2-2244752e9e28/7dd6e33b-867d-476c-a3d0-d1bb2ef7a332/preview.jpg",
url:"https://cdn.hyperserve.io/27503482-3ae8-4524-8fe2-2244752e9e28/7dd6e33b-867d-476c-a3d0-d1bb2ef7a332/1080p.mp4"
},

{title:"Video Title 2",views:"25.8K",category:"category2",duration:"08:15",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 3",views:"18.3K",category:"category1",duration:"07:14",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 4",views:"32.4K",category:"category2",duration:"09:20",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 5",views:"15.6K",category:"category1",duration:"05:30",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 6",views:"42.1K",category:"category2",duration:"11:25",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 7",views:"21.7K",category:"category1",duration:"08:40",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 8",views:"19.2K",category:"category2",duration:"06:50",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 9",views:"55.3K",category:"category1",duration:"10:15",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 10",views:"28.6K",category:"category2",duration:"07:35",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 11",views:"13.4K",category:"category1",duration:"09:10",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 12",views:"38.9K",category:"category2",duration:"12:20",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 13",views:"17.5K",category:"category1",duration:"06:45",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 14",views:"44.2K",category:"category2",duration:"08:30",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 15",views:"29.8K",category:"category1",duration:"07:55",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 16",views:"61.2K",category:"category2",duration:"10:40",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 17",views:"23.6K",category:"category1",duration:"05:45",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 18",views:"36.7K",category:"category2",duration:"09:35",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 19",views:"48.5K",category:"category1",duration:"11:10",poster:"images/IMG_6694.jpeg",url:""},
{title:"Video Title 20",views:"72.4K",category:"category2",duration:"08:25",poster:"images/IMG_6694.jpeg",url:""}

];

let selectedCategory = "all";

const grid = document.getElementById("videoGrid");

function displayVideos() {

    let search = document
    .getElementById("search")
    .value.toLowerCase();

    let filtered = videos.filter(video => {

        let categoryMatch =
        selectedCategory === "all" ||
        video.category === selectedCategory;

        let searchMatch =
        video.title.toLowerCase().includes(search);

        return categoryMatch && searchMatch;

    });

    grid.innerHTML = "";

    if(filtered.length === 0) {
        grid.innerHTML =
        '<div class="no-video">No videos found!</div>';
        return;
    }

    filtered.forEach(video => {

        let card = document.createElement("div");

        card.className = "video-card";

        card.innerHTML = `

        <div class="thumbnail">

            <img src="${video.poster}"
            alt="${video.title}"
            loading="lazy">

            <span class="play-icon">▶</span>

            <span class="duration">
            ${video.duration}
            </span>

        </div>

        <div class="video-title">
        ${video.title}
        </div>

        <div class="video-info">
        👤 Admin | ${video.views} views
        </div>

        `;

        card.addEventListener("click", () => {
            openVideo(video);
        });

        grid.appendChild(card);

    });

}

// FILTER

function filterVideos(category,button) {

    selectedCategory = category;

    document.querySelectorAll(".categories button")
    .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    displayVideos();

}

// SEARCH

document.getElementById("search")
.addEventListener("input", displayVideos);

// OPEN VIDEO

function openVideo(video) {

    if(!video.url) {
        alert("এই ভিডিওটি এখনো যুক্ত করা হয়নি।");
        return;
    }

    const player = document.getElementById("mainPlayer");

    player.src = video.url;

    player.poster = video.poster;

    document.getElementById("playerModal")
    .style.display = "flex";

    player.play().catch(() => {});

}

// CLOSE VIDEO

function closeVideo() {

    const player = document.getElementById("mainPlayer");

    player.pause();
    player.removeAttribute("src");
    player.load();

    document.getElementById("playerModal")
    .style.display = "none";

}

// CLOSE ON BACKGROUND CLICK

document.getElementById("playerModal")
.addEventListener("click", function(e) {

    if(e.target === this) {
        closeVideo();
    }

});

// INITIALIZE

displayVideos();

</script>

</body>
</html>
